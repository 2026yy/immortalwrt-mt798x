# Build ImmortalWrt-mt798x firmware with GitHub Actions.
name: 固件编译

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择需构建固件的设备型号'
        required: true
        default: 'h3c_nx30pro'
        type: choice
        options:
          - h3c_nx30pro
          - abt_asr3000
          - cetron_ct3003
          - cmcc_a10
          - cmcc_rax3000m
          - cmcc_rax3000m-emmc
          - imou_lc-hx3001
          - jcg_q30
          - konka_komi-a31
          - livinet_zr-3020
          - mt7981-360-t7-108M
          - mt7981-clt-r30b1
          - mt7981-clt-r30b1-112M
          - xiaomi_mi-router-ax3000t
          - xiaomi_mi-router-ax3000t-stock
          - xiaomi_mi-router-wr30u-112m
          - xiaomi_mi-router-wr30u-stock
          - all-mt7981-devices
      lan_addr:
        description: '设置默认 LAN IP 地址'
        required: true
        default: '192.168.100.2'
        type: string
      ap_mode:
        description: '是否 AP 模式（旁路由：关闭 DHCP，WAN 口并入 LAN，走上级网关）'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  DEFCONFIG: defconfig/mt7981-ax3000.config
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: Build ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -hT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install --no-install-recommends \
            build-essential ccache clang flex bison gawk gettext \
            gcc-multilib g++-multilib git libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-distutils python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler libelf-dev qemu-utils autoconf automake \
            libtool pkgconf cmake ninja-build patch xxd gperf
          sudo -E apt-get -qq clean

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/toolchain-*
          key: mt7981-${{ github.event.inputs.device }}-${{ hashFiles('defconfig/mt7981-ax3000.config', '.github/workflows/build.yml') }}
          restore-keys: |
            mt7981-${{ github.event.inputs.device }}-
            mt7981-

      - name: Prepare .config
        run: |
          cp -f "$DEFCONFIG" .config
          device="${{ github.event.inputs.device }}"
          if [ "$device" != "all-mt7981-devices" ]; then
            sed -i '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_/d' .config
            sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_/d' .config
            echo "CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_${device}=y" >> .config
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_${device}=\"\"" >> .config
            sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
            echo '# CONFIG_TARGET_MULTI_PROFILE is not set' >> .config
            echo '# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set' >> .config
          fi
          cat scripts/ci/ci-extra.config >> .config

      - name: Customize LAN IP
        run: |
          lan="${{ github.event.inputs.lan_addr }}"
          sed -i "s/192\.168\.6\.1/${lan}/" package/base-files/files/bin/config_generate

      - name: Apply AP mode overlay
        if: github.event.inputs.ap_mode == 'true'
        run: |
          lan="${{ github.event.inputs.lan_addr }}"
          gateway="$(echo "$lan" | awk -F. '{print $1"."$2"."$3".1"}')"
          mkdir -p files/etc/uci-defaults
          sed -e "s/@LAN_IP@/${lan}/g" -e "s/@LAN_GW@/${gateway}/g" \
            scripts/ci/99-ap-mode.sh > files/etc/uci-defaults/99-ap-mode
          chmod +x files/etc/uci-defaults/99-ap-mode
          echo "AP mode enabled: LAN=${lan} GATEWAY=${gateway}"

      - name: Sync SQM eqos turboacc defaults
        run: |
          mkdir -p files/etc/uci-defaults
          cp scripts/ci/zz-qos-sync.sh files/etc/uci-defaults/zz-qos-sync
          chmod +x files/etc/uci-defaults/zz-qos-sync

      - name: Update and install feeds
        run: |
          chmod +x scripts/ci/prepare-feeds.sh
          scripts/ci/prepare-feeds.sh

      - name: Set Argon as default theme
        run: |
          chmod +x scripts/ci/add-theme.sh
          scripts/ci/add-theme.sh "$PWD"

      - name: Download package
        id: package
        run: |
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "$(nproc) thread compile"
          ccache -s || true
          make -j"$(nproc)" || make -j1 V=s
          ccache -s || true
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: immortalwrt-${{ github.event.inputs.device }}-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ github.event.inputs.device }}-${{ env.FILE_DATE }}
          name: ${{ github.event.inputs.device }} ${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*
          generate_release_notes: true
